# The lockdown: one gate, to the sleighs
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lockdown
  namespace: paddock
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector:
        matchLabels:
          tier: sleigh
    ports:
    - protocol: TCP
      port: 5432
