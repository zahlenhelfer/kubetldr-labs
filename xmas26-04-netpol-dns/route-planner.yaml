apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-db
  namespace: route-planner
spec:
  replicas: 1
  selector:
    matchLabels: {app: route-db}
  template:
    metadata:
      labels: {app: route-db}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - {name: POSTGRES_PASSWORD, value: rud0lph}
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: route-db
  namespace: route-planner
spec:
  selector: {app: route-db}
  ports:
    - {port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-api
  namespace: route-planner
spec:
  replicas: 1
  selector:
    matchLabels: {app: route-api}
  template:
    metadata:
      labels: {app: route-api}
    spec:
      containers:
        - name: api
          image: postgres:17-alpine
          env:
            - {name: PGPASSWORD, value: rud0lph}
            - {name: PGCONNECT_TIMEOUT, value: "3"}
          command:
            - sh
            - -c
            - |
              while true; do
                psql -h route-db -U postgres -tAc "select 'route-db ok'" 2>&1
                sleep 5
              done
