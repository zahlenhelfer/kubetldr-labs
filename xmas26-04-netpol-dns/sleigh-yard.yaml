# XMAS26 4/5 — the paddock: one reindeer (app pod), two look-alike sleighs (databases)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sleigh-db
  namespace: paddock
spec:
  replicas: 1
  selector:
    matchLabels: {app: sleigh-db}
  template:
    metadata:
      labels: {app: sleigh-db, tier: sleigh}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - {name: POSTGRES_PASSWORD, value: rud0lph}
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: sleigh-db
  namespace: paddock
spec:
  selector: {app: sleigh-db}
  ports:
    - {port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spare-sleigh
  namespace: paddock
spec:
  replicas: 1
  selector:
    matchLabels: {app: spare-sleigh}
  template:
    metadata:
      labels: {app: spare-sleigh, tier: sleigh}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - {name: POSTGRES_PASSWORD, value: rud0lph}
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: spare-sleigh
  namespace: paddock
spec:
  selector: {app: spare-sleigh}
  ports:
    - {port: 5432, targetPort: 5432}
---
# The reindeer only knows its sleigh by name and asks for it every 5 s
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reindeer
  namespace: paddock
spec:
  replicas: 1
  selector:
    matchLabels: {app: reindeer}
  template:
    metadata:
      labels: {app: reindeer}
    spec:
      containers:
        - name: app
          image: postgres:17-alpine
          env:
            - {name: PGPASSWORD, value: rud0lph}
            - {name: PGCONNECT_TIMEOUT, value: "3"}
          command:
            - sh
            - -c
            - |
              while true; do
                psql -h sleigh-db -U postgres -tAc "select 'sleigh-db ok'" 2>&1 \
                  | sed -e 's/^psql: error: //' -e 's/ to address.*//'
                sleep 5
              done
