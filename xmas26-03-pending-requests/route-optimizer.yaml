apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-optimizer
  namespace: route-planner
spec:
  replicas: 1
  selector:
    matchLabels: {app: route-optimizer}
  template:
    metadata:
      labels: {app: route-optimizer}
    spec:
      containers:
        - name: optimizer
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "4"
